<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица лидеров</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="quiz-page">
    <h1>Таблица лидеров</h1>
    <h2>Топ-15 игроков</h2>

    {% if users %}
        <table class="leaderboard">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Имя</th>
                    <th>Очки</th>
                </tr>
            </thead>
            <tbody>
                {% for name, points in users %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td>{{ name }}</td>
                        <td>{{ points }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Пока никто не прошёл ни одной викторины.</p>
    {% endif %}

    <a href="/" class="home-link"><button type="button" class="home-btn">На главную</button></a>
</body>
</html>
