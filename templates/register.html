{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block body_class %}home-page{% endblock %}

{% block content %}
<h1>РЕГИСТРАЦИЯ</h1>
<h2>Балтийский Берег</h2>

<form class="info-card news-form" method="POST" action="{{ url_for('register') }}">
    <div class="info-title">Создайте аккаунт</div>
    <input type="text" name="name" value="{{ name or '' }}" placeholder="Имя (будет в таблице лидеров)"
           autocomplete="nickname" minlength="2" maxlength="30" required autofocus>
    <input type="email" name="email" value="{{ email or '' }}" placeholder="Email"
           autocomplete="email" maxlength="120" required>
    <input type="password" name="password" placeholder="Пароль"
           autocomplete="new-password" minlength="6" maxlength="128" required>
    <div class="form-hint">Пароль — не короче 6 символов.</div>
    <button type="submit" class="news-submit">Зарегистрироваться</button>
</form>

<a href="{{ url_for('login') }}" class="home-link"><button type="button" class="home-btn">Уже есть аккаунт? Войти</button></a>
<a href="/" class="home-link"><button type="button" class="home-btn">На главную</button></a>
{% endblock %}
