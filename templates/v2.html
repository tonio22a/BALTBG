<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Викторина 2</title>
    <!-- Подключаем ваш style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<!-- Обязательно добавляем класс quiz-page -->
<body class="quiz-page">
    <h1>Викторина 2. «Балтика в сезоне 25/26»</h1>
    <form method="POST">
        {% for q in questions %}
            <div>
                <p><b>{{ loop.index }}. {{ q.question }}</b></p>
                {% for opt in q.options %}
                    <label>
                        <input type="radio" name="question_{{ q.id }}" value="{{ opt }}" required>
                        {{ opt }}
                    </label><br>
                {% endfor %}
            </div>
            <hr>
        {% endfor %}
        <button type="submit">Отправить ответы</button>
    </form>
</body>
</html>
