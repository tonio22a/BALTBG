{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block body_class %}home-page{% endblock %}

{% block content %}
<h1>ВХОД</h1>
<h2>Балтийский Берег</h2>

<form class="info-card news-form" method="POST" action="{{ url_for('login') }}">
    <div class="info-title">Войдите в аккаунт</div>
    <input type="email" name="email" value="{{ email or '' }}" placeholder="Email"
           autocomplete="email" maxlength="120" required autofocus>
    <input type="password" name="password" placeholder="Пароль"
           autocomplete="current-password" maxlength="128" required>
    <button type="submit" class="news-submit">Войти</button>
</form>

<a href="{{ url_for('register') }}" class="home-link"><button type="button" class="home-btn">Регистрация</button></a>
<a href="/" class="home-link"><button type="button" class="home-btn">На главную</button></a>
{% endblock %}
