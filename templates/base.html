<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>{% block title %}DGram{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">

    <div class="footer">
        <a href="/contact"><button>Контакты</button></a>
        <a href="https://t.me/baltbereg1" target="_blank"><button>Телеграм</button></a>
        <h2>Балтийский Берег</h2>
        <p>Сделано Project "AU"</p>
    </div>

    {# сообщения входа/регистрации (flash с категорией "auth") #}
    {% for msg in get_flashed_messages(category_filter=["auth"]) %}
    <div class="auth-flash">{{ msg }}</div>
    {% endfor %}

    {% block content %}{% endblock %}

</body>
</html>
