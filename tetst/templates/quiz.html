<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Викторина Flask</title>
</head>
<body>
    <h1>Мини-викторина на Flask</h1>
    <form method="POST">
        {% for q in questions %}
            <div>
                <p><b>{{ loop.index }}. {{ q.question }}</b></p>
                {% for opt in q.options %}
                    <label>
                        <input type="radio" name="question_{{ q.id }}" value="{{ opt }}" required>
                        {{ opt }}
                    </label><br>
                {% endfor %}
            </div>
            <hr>
        {% endfor %}
        <button type="submit">Отправить ответы</button>
    </form>
</body>
</html>
